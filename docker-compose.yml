version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: prediction_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prediction_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prediction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: prediction_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prediction_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
